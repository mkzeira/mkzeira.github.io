<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Baixando MKzeira Launcher</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f0a1c; color: #f1eafe; font-family: system-ui, sans-serif; }
    main { text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Baixando a versão mais recente...</h1>
    <p>Se o download não começar, <a href="https://github.com/mkzeira/mkzeira_update" style="color:#fbbf24">clique aqui</a>.</p>
  </main>
  <script>
    const base = "https://media.githubusercontent.com/media/mkzeira/mkzeira_update/main/";
    fetch(base + "latest.yml?ts=" + Date.now())
      .then((response) => {
        if (!response.ok) throw new Error("latest.yml indisponível");
        return response.text();
      })
      .then((text) => {
        const match = text.match(/^\s*url:\s*(\S+)/m);
        if (!match) throw new Error("URL de download não encontrada");
        location.replace(base + match[1]);
      })
      .catch(() => location.replace("https://github.com/mkzeira/mkzeira_update"));
  </script>
</body>
</html>
